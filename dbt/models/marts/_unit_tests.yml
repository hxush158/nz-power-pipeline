version: 2

# dbt unit test：给模型手写几行假的上游数据（given），再写出期望输出（expect），
# 不读真实 CSV。expect 里只写关心的列。

unit_tests:

  # ---------- dim_node ----------
  - name: dim_node_n1_folds_case
    description: aby0111 与 ABY0111 是同一个节点，折叠成 1 行，node_id 存大写。
    model: dim_node
    given:
      - input: ref('stg_prices')
        rows:
          - {node_id: aby0111}
          - {node_id: ABY0111}
      - input: ref('node_reference')
        rows:
          - {node_id: ZZZ9999}
    expect:
      rows:
        - {node_id: ABY0111}

  - name: dim_node_n2_excludes_empty_ids
    description: NULL、空字符串、全空格的 node_id 没有身份，被排除。
    model: dim_node
    given:
      - input: ref('stg_prices')
        rows:
          - {node_id: null}
          - {node_id: ''}
          - {node_id: '   '}
          - {node_id: ABY0111}
      - input: ref('node_reference')
        rows:
          - {node_id: ZZZ9999}
    expect:
      rows:
        - {node_id: ABY0111}

  - name: dim_node_n3_keeps_leading_space_as_other_value
    description: 只折叠大小写，不 trim；带前导空格的值是另一个值，原样保留。
    model: dim_node
    given:
      - input: ref('stg_prices')
        rows:
          - {node_id: ABY0111}
          - {node_id: ' ABY0111'}
      - input: ref('node_reference')
        rows:
          - {node_id: ZZZ9999}
    expect:
      rows:
        - {node_id: ABY0111}
        - {node_id: ' ABY0111'}

  - name: dim_node_n4_joins_reference_case_insensitively
    description: seed 里的 node_id 按大写匹配；匹配到的节点带上名称、岛、分区、区域；没匹配到的为 NULL。
    model: dim_node
    given:
      - input: ref('stg_prices')
        rows:
          - {node_id: aby0111}
          - {node_id: QQQ9999}
      - input: ref('node_reference')
        rows:
          - {node_id: ABY0111, node_name: ALBURY, island: SI, zone: LSI, region: South Canterbury (Alpine Energy), mapping_source: nsp}
    expect:
      rows:
        - {node_id: ABY0111, node_name: ALBURY, island: SI, zone: LSI, region: South Canterbury (Alpine Energy), mapping_source: nsp}
        - {node_id: QQQ9999, node_name: null, island: null, zone: null, region: null, mapping_source: null}

  # ---------- fact_electricity_price ----------
  - name: fact_f1_keeps_final_and_interim
    description: 同一时段同一节点的 final 与 interim 是两个版本，两行并存。
    model: fact_electricity_price
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_prices')
        rows:
          - {trading_date: '2026-10-13', trading_period: 1, node_id: ABY0111, price_nzd_per_mwh: 50.5, price_version: final, source_file: 20261013_final.csv}
          - {trading_date: '2026-10-13', trading_period: 1, node_id: ABY0111, price_nzd_per_mwh: 40.25, price_version: interim, source_file: 20261013_interim.csv}
      - input: ref('dim_date')
        rows:
          - {date_key: 20261013, trading_date: '2026-10-13'}
      - input: ref('dim_trading_period')
        rows:
          - {period_key: 2026101301, date_key: 20261013, trading_period: 1}
      - input: ref('dim_node')
        rows:
          - {node_key: 111, node_id: ABY0111}
    expect:
      rows:
        - {period_key: 2026101301, node_key: 111, price_version: final, price_nzd_per_mwh: 50.50}
        - {period_key: 2026101301, node_key: 111, price_version: interim, price_nzd_per_mwh: 40.25}

  - name: fact_f2_joins_node_case_insensitively
    description: stg 里的小写 aby0111 能关联上大写的 dim_node，node_key 与 dim_node 一致。
    model: fact_electricity_price
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_prices')
        rows:
          - {trading_date: '2026-10-13', trading_period: 1, node_id: aby0111, price_nzd_per_mwh: 50.5, price_version: final, source_file: 20261013_final.csv}
      - input: ref('dim_date')
        rows:
          - {date_key: 20261013, trading_date: '2026-10-13'}
      - input: ref('dim_trading_period')
        rows:
          - {period_key: 2026101301, date_key: 20261013, trading_period: 1}
      - input: ref('dim_node')
        rows:
          - {node_key: 111, node_id: ABY0111}
    expect:
      rows:
        - {period_key: 2026101301, node_key: 111, price_version: final, price_nzd_per_mwh: 50.50}

  - name: fact_f3_drops_row_without_node
    description: 找不到对应节点的行被 inner join 丢弃（对账测试要抓的就是这种情况）。
    model: fact_electricity_price
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_prices')
        rows:
          - {trading_date: '2026-10-13', trading_period: 1, node_id: ABY0111, price_nzd_per_mwh: 50.5, price_version: final, source_file: 20261013_final.csv}
          - {trading_date: '2026-10-13', trading_period: 1, node_id: ZZZ9999, price_nzd_per_mwh: 60.0, price_version: final, source_file: 20261013_final.csv}
      - input: ref('dim_date')
        rows:
          - {date_key: 20261013, trading_date: '2026-10-13'}
      - input: ref('dim_trading_period')
        rows:
          - {period_key: 2026101301, date_key: 20261013, trading_period: 1}
      - input: ref('dim_node')
        rows:
          - {node_key: 111, node_id: ABY0111}
    expect:
      rows:
        - {period_key: 2026101301, node_key: 111, price_version: final, price_nzd_per_mwh: 50.50}

  # ---------- mart_current_price ----------
  - name: current_c1_prefers_final
    description: 同一时段同一节点既有 final 又有 interim，取 final。
    model: mart_current_price
    given:
      - input: ref('fact_electricity_price')
        rows:
          - {period_key: 2026101301, node_key: 111, price_version: final, price_nzd_per_mwh: 90.00, source_file: 20261013_final.csv}
          - {period_key: 2026101301, node_key: 111, price_version: interim, price_nzd_per_mwh: 80.00, source_file: 20261013_interim.csv}
      - input: ref('dim_trading_period')
        rows:
          - {period_key: 2026101301, date_key: 20261013, trading_period: 1}
      - input: ref('dim_date')
        rows:
          - {date_key: 20261013, trading_date: '2026-10-13'}
      - input: ref('dim_node')
        rows:
          - {node_key: 111, node_id: ABY0111}
    expect:
      rows:
        - {period_key: 2026101301, node_key: 111, price_nzd_per_mwh: 90.00, price_version: final}

  - name: current_c2_falls_back_to_interim
    description: 只有 interim 时取 interim。
    model: mart_current_price
    given:
      - input: ref('fact_electricity_price')
        rows:
          - {period_key: 2026101301, node_key: 111, price_version: interim, price_nzd_per_mwh: 80.00, source_file: 20261013_interim.csv}
      - input: ref('dim_trading_period')
        rows:
          - {period_key: 2026101301, date_key: 20261013, trading_period: 1}
      - input: ref('dim_date')
        rows:
          - {date_key: 20261013, trading_date: '2026-10-13'}
      - input: ref('dim_node')
        rows:
          - {node_key: 111, node_id: ABY0111}
    expect:
      rows:
        - {period_key: 2026101301, node_key: 111, price_nzd_per_mwh: 80.00, price_version: interim}

  # ---------- mart_daily_price ----------
  - name: daily_d1_average_rounds_and_counts_interim
    description: 3 个时段 10.00 / 20.00 / 25.55（其中 1 个 interim），均价 18.5167 四舍五入为 18.52。
    model: mart_daily_price
    given:
      - input: ref('mart_current_price')
        rows:
          - {trading_date: '2026-10-13', node_key: 111, node_id: ABY0111, price_nzd_per_mwh: 10.00, price_version: final}
          - {trading_date: '2026-10-13', node_key: 111, node_id: ABY0111, price_nzd_per_mwh: 20.00, price_version: final}
          - {trading_date: '2026-10-13', node_key: 111, node_id: ABY0111, price_nzd_per_mwh: 25.55, price_version: interim}
    expect:
      rows:
        - {trading_date: '2026-10-13', node_key: 111, avg_price: 18.52, min_price: 10.00, max_price: 25.55, period_count: 3, interim_period_count: 1}

  - name: daily_d2_tie_rounds_away_from_zero_positive
    description: 10.00 与 10.01 的平均是 10.005，恰好在中间，远离零进位得 10.01（浮点数运算可能得到 10.00）。
    model: mart_daily_price
    given:
      - input: ref('mart_current_price')
        rows:
          - {trading_date: '2026-10-13', node_key: 111, node_id: ABY0111, price_nzd_per_mwh: 10.00, price_version: final}
          - {trading_date: '2026-10-13', node_key: 111, node_id: ABY0111, price_nzd_per_mwh: 10.01, price_version: final}
    expect:
      rows:
        - {trading_date: '2026-10-13', node_key: 111, avg_price: 10.01, period_count: 2}

  - name: daily_d3_tie_rounds_away_from_zero_negative
    description: -10.00 与 -10.01 的平均是 -10.005，负价也远离零进位得 -10.01（不是 -10.00）。
    model: mart_daily_price
    given:
      - input: ref('mart_current_price')
        rows:
          - {trading_date: '2026-10-13', node_key: 111, node_id: ABY0111, price_nzd_per_mwh: -10.00, price_version: final}
          - {trading_date: '2026-10-13', node_key: 111, node_id: ABY0111, price_nzd_per_mwh: -10.01, price_version: final}
    expect:
      rows:
        - {trading_date: '2026-10-13', node_key: 111, avg_price: -10.01, period_count: 2}

  - name: daily_d4_tie_around_zero
    description: 0.00 与 0.01 的平均 0.005 得 0.01；-0.01 与 0.00 的平均 -0.005 得 -0.01（对称，远离零）。
    model: mart_daily_price
    given:
      - input: ref('mart_current_price')
        rows:
          - {trading_date: '2026-10-13', node_key: 111, node_id: ABY0111, price_nzd_per_mwh: 0.00, price_version: final}
          - {trading_date: '2026-10-13', node_key: 111, node_id: ABY0111, price_nzd_per_mwh: 0.01, price_version: final}
          - {trading_date: '2026-10-13', node_key: 112, node_id: BEN2201, price_nzd_per_mwh: -0.01, price_version: final}
          - {trading_date: '2026-10-13', node_key: 112, node_id: BEN2201, price_nzd_per_mwh: 0.00, price_version: final}
    expect:
      rows:
        - {trading_date: '2026-10-13', node_key: 111, avg_price: 0.01, period_count: 2}
        - {trading_date: '2026-10-13', node_key: 112, avg_price: -0.01, period_count: 2}

  - name: daily_d5_tie_cases_that_float_average_gets_wrong
    description: >
      旧写法 round(avg(DECIMAL), 2) 在 DuckDB 上会算错的真实反例（avg 先变成 DOUBLE）：
      0.28 与 0.29 的平均 0.285 旧写法得 0.28，1.00 与 1.01 的平均 1.005 旧写法得 1.00，
      负价同理。正确结果都是远离零进位：0.29、1.01、-0.29。
      （在 0–1000 元的相邻两分价格里，旧写法约有 4.6% 的组合算错，见 sql/explore/avg_round_find_failing_case.sql。）
    model: mart_daily_price
    given:
      - input: ref('mart_current_price')
        rows:
          - {trading_date: '2026-10-13', node_key: 111, node_id: ABY0111, price_nzd_per_mwh: 0.28, price_version: final}
          - {trading_date: '2026-10-13', node_key: 111, node_id: ABY0111, price_nzd_per_mwh: 0.29, price_version: final}
          - {trading_date: '2026-10-13', node_key: 112, node_id: BEN2201, price_nzd_per_mwh: -0.28, price_version: final}
          - {trading_date: '2026-10-13', node_key: 112, node_id: BEN2201, price_nzd_per_mwh: -0.29, price_version: final}
          - {trading_date: '2026-10-13', node_key: 113, node_id: HLY2201, price_nzd_per_mwh: 1.00, price_version: final}
          - {trading_date: '2026-10-13', node_key: 113, node_id: HLY2201, price_nzd_per_mwh: 1.01, price_version: final}
    expect:
      rows:
        - {trading_date: '2026-10-13', node_key: 111, avg_price: 0.29, period_count: 2}
        - {trading_date: '2026-10-13', node_key: 112, avg_price: -0.29, period_count: 2}
        - {trading_date: '2026-10-13', node_key: 113, avg_price: 1.01, period_count: 2}

  # ---------- v_dim_node ----------
  - name: v_dim_node_v1_first_seen_date
    description: 节点 A 从全局最早日（10-01）开始，是基线节点，为 NULL；节点 B 从 10-05 开始，是 10-05。
    model: v_dim_node
    given:
      - input: ref('fact_electricity_price')
        rows:
          - {period_key: 2026100101, node_key: 1}
          - {period_key: 2026100501, node_key: 2}
      - input: ref('dim_trading_period')
        rows:
          - {period_key: 2026100101, date_key: 20261001}
          - {period_key: 2026100501, date_key: 20261005}
      - input: ref('dim_date')
        rows:
          - {date_key: 20261001, trading_date: '2026-10-01'}
          - {date_key: 20261005, trading_date: '2026-10-05'}
      - input: ref('dim_node')
        rows:
          - {node_key: 1, node_id: AAA0001}
          - {node_key: 2, node_id: BBB0002}
    expect:
      rows:
        - {node_id: AAA0001, first_seen_date: null}
        - {node_id: BBB0002, first_seen_date: '2026-10-05'}

  - name: fact_f4_keeps_negative_prices
    description: 负价格是真实的市场价格，原样保留。
    model: fact_electricity_price
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_prices')
        rows:
          - {trading_date: '2026-10-13', trading_period: 1, node_id: ABY0111, price_nzd_per_mwh: -12.34, price_version: final, source_file: 20261013_final.csv}
      - input: ref('dim_date')
        rows:
          - {date_key: 20261013, trading_date: '2026-10-13'}
      - input: ref('dim_trading_period')
        rows:
          - {period_key: 2026101301, date_key: 20261013, trading_period: 1}
      - input: ref('dim_node')
        rows:
          - {node_key: 111, node_id: ABY0111}
    expect:
      rows:
        - {period_key: 2026101301, node_key: 111, price_version: final, price_nzd_per_mwh: -12.34}

  # ---------- fact_electricity_price：增量运行 ----------
  # 增量 unit test 的 expect 是"这次运行要插入的行"；旧行的删除由 dbt 按 unique_key 完成，
  # 不在 SQL 里，所以这里测的是"窗口内的数据会被重新选中、窗口外的不会"。
  - name: fact_i1_revised_final_in_window_is_selected_again
    description: 窗口内被修订的 final 价格会被重新选中，带着新值去覆盖旧行。
    model: fact_electricity_price
    overrides:
      macros:
        is_incremental: true
    given:
      - input: ref('stg_prices')
        rows:
          - {trading_date: '2026-10-13', trading_period: 1, node_id: ABY0111, price_nzd_per_mwh: 60.0, price_version: final, source_file: 20261013_final.csv}
      - input: ref('dim_date')
        rows:
          - {date_key: 20261013, trading_date: '2026-10-13'}
      - input: ref('dim_trading_period')
        rows:
          - {period_key: 2026101301, date_key: 20261013, trading_period: 1}
      - input: ref('dim_node')
        rows:
          - {node_key: 111, node_id: ABY0111}
      - input: this
        rows:
          - {period_key: 2026101301, node_key: 111, price_version: final, price_nzd_per_mwh: 50.00, source_file: 20261013_final.csv}
    expect:
      rows:
        - {period_key: 2026101301, node_key: 111, price_version: final, price_nzd_per_mwh: 60.00}

  - name: fact_i2_rows_older_than_lookback_window_are_not_reprocessed
    description: 已加载数据最晚是 10-13，窗口起点是 10-06；10-01 的行不处理，10-12 的行处理。
    model: fact_electricity_price
    overrides:
      macros:
        is_incremental: true
    given:
      - input: ref('stg_prices')
        rows:
          - {trading_date: '2026-10-01', trading_period: 1, node_id: ABY0111, price_nzd_per_mwh: 10.0, price_version: final, source_file: 20261001_final.csv}
          - {trading_date: '2026-10-12', trading_period: 1, node_id: ABY0111, price_nzd_per_mwh: 20.0, price_version: final, source_file: 20261012_final.csv}
      - input: ref('dim_date')
        rows:
          - {date_key: 20261001, trading_date: '2026-10-01'}
          - {date_key: 20261012, trading_date: '2026-10-12'}
          - {date_key: 20261013, trading_date: '2026-10-13'}
      - input: ref('dim_trading_period')
        rows:
          - {period_key: 2026100101, date_key: 20261001, trading_period: 1}
          - {period_key: 2026101201, date_key: 20261012, trading_period: 1}
          - {period_key: 2026101301, date_key: 20261013, trading_period: 1}
      - input: ref('dim_node')
        rows:
          - {node_key: 111, node_id: ABY0111}
      - input: this
        rows:
          - {period_key: 2026101301, node_key: 111, price_version: final, price_nzd_per_mwh: 50.00, source_file: 20261013_final.csv}
    expect:
      rows:
        - {period_key: 2026101201, node_key: 111, price_version: final, price_nzd_per_mwh: 20.00}

  - name: fact_i3_incremental_run_on_empty_table_loads_everything
    description: 已有的表是空的时，没有"最晚交易日"，不能因此什么都不加载。
    model: fact_electricity_price
    overrides:
      macros:
        is_incremental: true
    given:
      - input: ref('stg_prices')
        rows:
          - {trading_date: '2026-10-13', trading_period: 1, node_id: ABY0111, price_nzd_per_mwh: 50.0, price_version: final, source_file: 20261013_final.csv}
      - input: ref('dim_date')
        rows:
          - {date_key: 20261013, trading_date: '2026-10-13'}
      - input: ref('dim_trading_period')
        rows:
          - {period_key: 2026101301, date_key: 20261013, trading_period: 1}
      - input: ref('dim_node')
        rows:
          - {node_key: 111, node_id: ABY0111}
      - input: this
        rows: []
    expect:
      rows:
        - {period_key: 2026101301, node_key: 111, price_version: final, price_nzd_per_mwh: 50.00}

  # ---------- dim_plant ----------
  - name: dim_plant_p1_one_row_per_plant_node_network_with_fuel_mapped
    description: >
      粒度是 电厂 × 节点 × 网络：同一电厂在 MRPL 和 POCO 两个网络各一行；
      stg 里 288 个时段行折叠成一行；燃料代码按 fuel_map 映射（HYD→Hydro，ELE→Battery storage）。
    model: dim_plant
    given:
      - input: ref('stg_generation')
        rows:
          - {plant_code: arapuni, node_id: ARI1102, network_code: MRPL, site_code: ARI, fuel_code: HYD, tech_code: HYD, trading_period: 1}
          - {plant_code: arapuni, node_id: ARI1102, network_code: MRPL, site_code: ARI, fuel_code: HYD, tech_code: HYD, trading_period: 2}
          - {plant_code: arapuni, node_id: ARI1102, network_code: POCO, site_code: ARI, fuel_code: HYD, tech_code: HYD, trading_period: 1}
          - {plant_code: bess_one, node_id: BSS0001, network_code: POCO, site_code: BSS, fuel_code: ELE, tech_code: BAT, trading_period: 1}
      - input: ref('fuel_map')
        rows:
          - {fuel_code: HYD, fuel: Hydro}
          - {fuel_code: ELE, fuel: Battery storage}
      - input: ref('dim_node')
        rows:
          - {node_id: ARI1102, island: NI, zone: CNI}
    expect:
      rows:
        - {plant_code: arapuni, node_id: ARI1102, network_code: MRPL, site_code: ARI, fuel_code: HYD, tech_code: HYD, fuel: Hydro, island: NI, zone: CNI, is_price_node: true}
        - {plant_code: arapuni, node_id: ARI1102, network_code: POCO, site_code: ARI, fuel_code: HYD, tech_code: HYD, fuel: Hydro, island: NI, zone: CNI, is_price_node: true}
        - {plant_code: bess_one, node_id: BSS0001, network_code: POCO, site_code: BSS, fuel_code: ELE, tech_code: BAT, fuel: Battery storage, island: null, zone: null, is_price_node: false}

  - name: dim_plant_p2_unmapped_fuel_code_gives_null_fuel
    description: fuel_map 里没有的燃料代码，fuel 为 NULL（由 dim_plant 上的 not_null 测试报错），行不丢。
    model: dim_plant
    given:
      - input: ref('stg_generation')
        rows:
          - {plant_code: mystery, node_id: MYS0001, network_code: MRPL, site_code: MYS, fuel_code: XYZ, tech_code: XYZ, trading_period: 1}
      - input: ref('fuel_map')
        rows:
          - {fuel_code: HYD, fuel: Hydro}
      - input: ref('dim_node')
        rows:
          - {node_id: MYS0001, island: SI, zone: LSI}
    expect:
      rows:
        - {plant_code: mystery, node_id: MYS0001, network_code: MRPL, fuel_code: XYZ, fuel: null, island: SI, zone: LSI, is_price_node: true}

  # ---------- fact_generation ----------
  - name: fact_generation_g1_maps_period_and_plant_keys_and_keeps_zero
    description: 一行 stg 对应一行事实：period_key 来自日期 + 时段，plant_key 来自 电厂 × 节点 × 网络；0 kWh 保留。
    model: fact_generation
    given:
      - input: ref('stg_generation')
        rows:
          - {trading_date: '2026-04-05', trading_period: 49, plant_code: arapuni, node_id: ARI1102, network_code: MRPL, generation_kwh: 5, source_file: 202604_Generation_MD.csv}
          - {trading_date: '2026-04-05', trading_period: 50, plant_code: arapuni, node_id: ARI1102, network_code: MRPL, generation_kwh: 0, source_file: 202604_Generation_MD.csv}
      - input: ref('dim_date')
        rows:
          - {date_key: 20260405, trading_date: '2026-04-05'}
      - input: ref('dim_trading_period')
        rows:
          - {period_key: 2026040549, date_key: 20260405, trading_period: 49}
          - {period_key: 2026040550, date_key: 20260405, trading_period: 50}
      - input: ref('dim_plant')
        rows:
          - {plant_key: 7, plant_code: arapuni, node_id: ARI1102, network_code: MRPL}
    expect:
      rows:
        - {period_key: 2026040549, plant_key: 7, generation_kwh: 5, source_file: 202604_Generation_MD.csv}
        - {period_key: 2026040550, plant_key: 7, generation_kwh: 0, source_file: 202604_Generation_MD.csv}

  - name: fact_generation_g2_same_plant_two_networks_get_different_plant_keys
    description: 同一电厂、同一节点、同一时段在两个网络各一行，分别关联到各自的 plant_key，不串、不合并。
    model: fact_generation
    given:
      - input: ref('stg_generation')
        rows:
          - {trading_date: '2026-04-01', trading_period: 1, plant_code: arapuni, node_id: ARI1102, network_code: MRPL, generation_kwh: 3376, source_file: 202604_Generation_MD.csv}
          - {trading_date: '2026-04-01', trading_period: 1, plant_code: arapuni, node_id: ARI1102, network_code: POCO, generation_kwh: 0, source_file: 202604_Generation_MD.csv}
      - input: ref('dim_date')
        rows:
          - {date_key: 20260401, trading_date: '2026-04-01'}
      - input: ref('dim_trading_period')
        rows:
          - {period_key: 2026040101, date_key: 20260401, trading_period: 1}
      - input: ref('dim_plant')
        rows:
          - {plant_key: 7, plant_code: arapuni, node_id: ARI1102, network_code: MRPL}
          - {plant_key: 8, plant_code: arapuni, node_id: ARI1102, network_code: POCO}
    expect:
      rows:
        - {period_key: 2026040101, plant_key: 7, generation_kwh: 3376}
        - {period_key: 2026040101, plant_key: 8, generation_kwh: 0}

  # ---------- mart_daily_generation ----------
  - name: daily_gen_m1_sums_kwh_and_counts_distinct_plants
    description: >
      同一天、同岛、同分区、同燃料的发电量相加；电厂数按 plant_code 去重（同一电厂在两个网络各一行，只算 1 个）；
      不同燃料分开。
    model: mart_daily_generation
    given:
      - input: ref('fact_generation')
        rows:
          - {period_key: 2026040101, plant_key: 1, generation_kwh: 100}
          - {period_key: 2026040102, plant_key: 1, generation_kwh: 200}
          - {period_key: 2026040101, plant_key: 2, generation_kwh: 0}
          - {period_key: 2026040101, plant_key: 3, generation_kwh: 50}
      - input: ref('dim_plant')
        rows:
          - {plant_key: 1, plant_code: arapuni, island: NI, zone: CNI, fuel: Hydro}
          - {plant_key: 2, plant_code: arapuni, island: NI, zone: CNI, fuel: Hydro}
          - {plant_key: 3, plant_code: te_apiti, island: NI, zone: LNI, fuel: Wind}
      - input: ref('dim_trading_period')
        rows:
          - {period_key: 2026040101, date_key: 20260401}
          - {period_key: 2026040102, date_key: 20260401}
      - input: ref('dim_date')
        rows:
          - {date_key: 20260401, trading_date: '2026-04-01'}
    expect:
      rows:
        - {trading_date: '2026-04-01', island: NI, zone: CNI, fuel: Hydro, generation_kwh: 300, plant_count: 1}
        - {trading_date: '2026-04-01', island: NI, zone: LNI, fuel: Wind, generation_kwh: 50, plant_count: 1}

  - name: daily_gen_m2_keeps_plants_at_non_price_nodes_with_null_island
    description: 不在价格节点里的电厂（岛和分区为 NULL）仍然计入发电量，不丢；island 和 zone 为 NULL。
    model: mart_daily_generation
    given:
      - input: ref('fact_generation')
        rows:
          - {period_key: 2026040101, plant_key: 9, generation_kwh: 40}
      - input: ref('dim_plant')
        rows:
          - {plant_key: 9, plant_code: wpg_plant, island: null, zone: null, fuel: Gas}
      - input: ref('dim_trading_period')
        rows:
          - {period_key: 2026040101, date_key: 20260401}
      - input: ref('dim_date')
        rows:
          - {date_key: 20260401, trading_date: '2026-04-01'}
    expect:
      rows:
        - {trading_date: '2026-04-01', island: null, zone: null, fuel: Gas, generation_kwh: 40, plant_count: 1}

  # ---------- mart_daily_generation_weighted_price ----------
  - name: gen_price_w1_weights_price_by_kwh
    description: 100 kWh 卖 10.00、300 kWh 卖 20.00，加权均价 (1000 + 6000) / 400 = 17.50（简单平均是 15.00）。
    model: mart_daily_generation_weighted_price
    given:
      - input: ref('fact_generation')
        rows:
          - {period_key: 2026040101, plant_key: 1, generation_kwh: 100}
          - {period_key: 2026040102, plant_key: 1, generation_kwh: 300}
      - input: ref('dim_plant')
        rows:
          - {plant_key: 1, node_id: ARI1102, island: NI, fuel: Hydro}
      - input: ref('dim_trading_period')
        rows:
          - {period_key: 2026040101, date_key: 20260401}
          - {period_key: 2026040102, date_key: 20260401}
      - input: ref('dim_date')
        rows:
          - {date_key: 20260401, trading_date: '2026-04-01'}
      - input: ref('mart_current_price')
        rows:
          - {period_key: 2026040101, node_id: ARI1102, price_nzd_per_mwh: 10.00, price_version: final}
          - {period_key: 2026040102, node_id: ARI1102, price_nzd_per_mwh: 20.00, price_version: final}
    expect:
      rows:
        - {trading_date: '2026-04-01', island: NI, fuel: Hydro, generation_kwh: 400, interim_generation_kwh: 0, weighted_avg_price: 17.50}

  - name: gen_price_w2_two_plants_at_one_node_both_use_the_node_price
    description: 同一节点同一时段的两个电厂（或两个网络）都用该节点的价格，发电量相加，价格不重复计入。
    model: mart_daily_generation_weighted_price
