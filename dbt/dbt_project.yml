name: nz_power
version: "0.1.0"
config-version: 2
profile: nz_power

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

vars:
  # 相对路径，必须从项目根目录运行 dbt（见 README）
  raw_prices_glob: "data/raw/prices/*.csv"
  # 事实表增量加载时，每次重新处理已加载数据里最晚交易日往前 N 天的数据（覆盖被修订的价格）
  fact_lookback_days: 7

models:
  nz_power:
    staging:
      +materialized: view
    marts:
      +materialized: table
