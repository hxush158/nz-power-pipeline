# 默认 target 是本地 DuckDB；Snowflake 用 `--target snowflake` 切换。
# Snowflake 凭据全部来自环境变量，仓库里没有任何密钥。
# 口令的变量名以 DBT_ENV_SECRET_ 开头：dbt 会把它从日志里隐去。
nz_power:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: dbt_dev.duckdb
      threads: 4

    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('DBT_SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('DBT_SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      private_key_passphrase: "{{ env_var('DBT_ENV_SECRET_SNOWFLAKE_PASSPHRASE') }}"
      role: NZ_TRANSFORMER
      warehouse: WH_XS
      database: NZ_POWER
      schema: STAGING
      threads: 4
